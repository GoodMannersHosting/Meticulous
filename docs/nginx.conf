server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect root to /docs/
    location = / {
        return 301 /docs/;
    }

    # Serve docs under /docs/; clean URLs (MkDocs Material generates index.html per dir)
    location /docs/ {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Redirect bare /docs to /docs/
    location = /docs {
        return 301 /docs/;
    }

    # Health check for Kubernetes probes
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively; HTML not cached (MkDocs hashes assets)
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
