site_name: Meticulous
site_description: Self-hosted CI/CD with egress-only agents, per-job secrets, and versioned workflows
# Set SITE_URL env var at build time to control canonical links and sitemap.
# Example: SITE_URL=https://ci.example.com/docs/ mkdocs build
site_url: !ENV [SITE_URL, 'https://localhost/docs/']
docs_dir: pages
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.integrate

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Pipeline Model: architecture/pipeline-model.md
      - Agent & Controller: architecture/agents.md
  - Comparison:
      - vs GitHub Actions: comparison/github-actions.md
      - vs GitLab CI: comparison/gitlab-ci.md
      - vs Jenkins: comparison/jenkins.md
  - Security:
      - Security Model: security/model.md
      - Join Tokens & Secrets: security/secrets.md
  - API:
      - API Reference: api/reference.md
      - Authentication: api/authentication.md
  - Operator:
      - Deploying with Kubernetes: operator/install.md
      - Meticulous Apps & JWTs: operator/apps-jwt.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/getmeticulous

copyright: Copyright &copy; Meticulous
